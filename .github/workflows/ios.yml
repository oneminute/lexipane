name: iOS build (unsigned check)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package*.json'
      - '.github/workflows/ios.yml'
      - 'vite.config.ts'

permissions:
  contents: read

jobs:
  ios-check:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Web typecheck and tests
        run: |
          npm run typecheck
          npm test -- --run
      - name: Initialize iOS project
        run: npx tauri ios init --ci
      - name: Compile iOS simulator (no signing)
        run: npx tauri ios build --debug --target aarch64-sim --no-sign
