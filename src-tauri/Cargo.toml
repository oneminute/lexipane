[package]
name = "lexipane"
version = "0.1.0"
description = "Cross-platform AI-assisted ebook reader"
authors = ["LexiPane contributors"]
edition = "2021"

[lib]
name = "lexipane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
futures-util = "0.3"
fs2 = "0.4"
hmac = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
librqbit = "9.0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip", "brotli", "deflate"] }
roxmltree = "0.20"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "process"] }
urlencoding = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-persisted-scope = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["linux-native"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
